name: Verify Release

# 独立的验收流程：自动拉取 Release 里的各平台包 → 在对应平台/架构上真跑一遍
# → 每个平台的输出按 平台_架构 上传为可下载 artifact（test_<平台>_<架构>）
on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（默认 nightly）'
        default: 'nightly'
  schedule:
    - cron: '30 3 * * *'          # 每天 UTC 03:30 复验一次 nightly

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || 'nightly' }}
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'

jobs:
  verify:
    name: test_${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.soft == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux_x86_64,  runner: ubuntu-22.04,     asset: 'OwnRender-linux-x86_64.tar.gz',   kind: native,  plat: linux, arch: x86_64 }
          # linux_x86(i386) 与 linux_armv7(armhf) 已弃用，不再产出、也不再验收
          # （原因见 docs/二进制包.md「已弃用平台」）
          - { key: linux_aarch64, runner: ubuntu-24.04-arm, asset: 'OwnRender-linux-aarch64.tar.gz',  kind: native,  plat: linux, arch: aarch64 }
          - { key: windows_x86_64, runner: windows-latest,  asset: 'OwnRender-windows-x86_64.zip',    kind: win,     plat: windows, arch: amd64 }
          - { key: windows_x86,    runner: windows-latest,  asset: 'OwnRender-windows-x86.zip',       kind: win,     plat: windows, arch: x86 }
          - { key: windows_arm64,  runner: windows-11-arm,  asset: 'OwnRender-windows-arm64.zip',     kind: win,     plat: windows, arch: arm64, soft: true }
          - { key: android_arm64_v8a,   runner: ubuntu-22.04, asset: 'OwnRender-android-arm64-v8a-so.zip',   kind: ziponly, plat: android, arch: arm64-v8a }
          - { key: android_armeabi_v7a, runner: ubuntu-22.04, asset: 'OwnRender-android-armeabi-v7a-so.zip', kind: ziponly, plat: android, arch: armeabi-v7a }
          # 文档包也要验：别让文档缺页/参数文档过期悄悄发出去
          - { key: docs_package,  runner: ubuntu-22.04,     asset: 'OwnRender-docs.zip',              kind: docs,    plat: docs,    arch: zip }
    steps:
      - uses: actions/checkout@v4

      - name: 准备 qemu（armv7 容器需要）
        if: matrix.kind == 'docker' && matrix.plat == 'linux' && matrix.arch == 'armv7l'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: 拉取 Release 资产
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl "out/${{ matrix.key }}"
          if gh release download "$TAG" --pattern '${{ matrix.asset }}' --dir dl --clobber; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            ls -la dl
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Release($TAG) 里还没有 ${{ matrix.asset }}（该平台可能尚未构建成功）"
            {
              echo "平台/架构：${{ matrix.plat }}/${{ matrix.arch }}"
              echo "结论：MISSING"
              echo "说明：Release($TAG) 里没有资产 ${{ matrix.asset }}，该平台尚未产出可发布的包。"
              echo "Release 现有资产："
              gh release view "$TAG" --json assets -q '.assets[].name' | sed 's/^/  - /'
            } > "out/${{ matrix.key }}/summary.txt"
            cat "out/${{ matrix.key }}/summary.txt"
          fi

      - name: 安装验收脚本用到的 Python（宿主）
        if: matrix.kind == 'native' || matrix.kind == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 原生 Linux ────────────────────────────────────────────
      - name: 解压 + 验收（原生 Linux）
        if: matrix.kind == 'native' && steps.dl.outputs.found == '1'
        shell: bash
        run: |
          set -e
          mkdir -p pkg && tar -xzf dl/${{ matrix.asset }} -C pkg
          python3 tools/verify_package.py --package-dir pkg --out-dir out/${{ matrix.key }} \
            --platform ${{ matrix.plat }} --arch ${{ matrix.arch }} --ascii-env

      # ── 容器内验收（32 位 x86 / armv7）────────────────────────
      - name: 解压 + 容器内验收
        if: matrix.kind == 'docker' && steps.dl.outputs.found == '1'
        shell: bash
        run: |
          set -e
          mkdir -p pkg && tar -xzf dl/${{ matrix.asset }} -C pkg
          docker run --rm --platform '${{ matrix.platform }}' \
            -v "$PWD:/w" -w /w \
            -e LANG=C.UTF-8 -e PYTHONUTF8=1 \
            '${{ matrix.image }}' bash -lc '
              set -e
              apt-get update -qq >/dev/null 2>&1
              apt-get install -y -qq python3 >/dev/null 2>&1
              python3 tools/verify_package.py --package-dir pkg \
                --out-dir out/${{ matrix.key }} \
                --platform ${{ matrix.plat }} --arch ${{ matrix.arch }} --ascii-env '

      # ── Windows ──────────────────────────────────────────────
      - name: 解压 + 验收（Windows）
        if: matrix.kind == 'win' && steps.dl.outputs.found == '1'
        shell: bash
        run: |
          set -e
          mkdir -p pkg && unzip -q -o dl/${{ matrix.asset }} -d pkg
          python tools/verify_package.py --package-dir pkg --out-dir out/${{ matrix.key }} \
            --platform ${{ matrix.plat }} --arch ${{ matrix.arch }}

      # ── Android：验 native .so 包 + 完整 APK（numpy/Pillow 的模块在
      #    APK 的 assets/_python_bundle 里，所以 APK 才是主验收对象）─────
      - name: 验收（Android：.so 包 + APK 内容）
        if: matrix.kind == 'ziponly' && steps.dl.outputs.found == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          APK="dl/OwnRender-android-${{ matrix.arch }}.apk"
          gh release download "$TAG" --pattern "OwnRender-android-${{ matrix.arch }}.apk" \
            --dir dl --clobber \
            || echo "::warning::Release($TAG) 里还没有 OwnRender-android-${{ matrix.arch }}.apk"
          python tools/verify_package.py \
            --out-dir "out/${{ matrix.key }}" \
            --platform android --arch "${{ matrix.arch }}" \
            --android-so-zip "dl/${{ matrix.asset }}" \
            --android-apk "$APK"
          rc=$?
          echo "验收退出码：$rc"
          exit $rc

# ── 文档包：必须含参数文档与工具脚本，且参数文档与仓库一致 ──────
      - name: 验收（文档包完整性）
        if: matrix.kind == 'docs' && steps.dl.outputs.found == '1'
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, os, zipfile
          key, out = "${{ matrix.key }}", os.path.join("out", "${{ matrix.key }}")
          os.makedirs(out, exist_ok=True)
          z = zipfile.ZipFile("dl/${{ matrix.asset }}")
          names = z.namelist()
          # 期望清单直接由仓库文件树推出（不写死），加文件/改名都不会漏
          want_prefix = ("docs/", "tools/")
          want_files = ("README.md", "README.en.md", "LICENSE", "CREDITS.md")
          expect = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "__pycache__")]
              for f in files:
                  p = os.path.relpath(os.path.join(root, f), ".")
                  if p.startswith(want_prefix) or p in want_files:
                      expect.append(p.replace(os.sep, "/"))
          miss = sorted(p for p in expect if p not in names)
          # 参数文档必须与仓库里的定义一致（把 zip 里的 JSON 与原文件比对）
          same = None
          if "docs/cli-args.json" in names:
              same = z.read("docs/cli-args.json") == open("docs/cli-args.json", "rb").read()
          problems = ["文档包缺少 %s" % m for m in miss[:20]]
          if len(miss) > 20:
              problems.append("…还有 %d 个文件缺失" % (len(miss) - 20))
          if same is False:
              problems.append("文档包里的 cli-args.json 与仓库版本不一致（参数文档过期）")
          verdict = "PASS" if not problems else "FAIL"
          json.dump({"platform": "docs", "arch": "zip", "verdict": verdict,
                     "repo_expected": len(expect), "zip_files": len(names),
                     "missing": miss[:50], "args_json_matches_repo": same,
                     "problems": problems},
                    open(os.path.join(out, "meta.json"), "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2)
          open(os.path.join(out, "summary.txt"), "w", encoding="utf-8").write(
              "平台/架构：docs/zip\n结论：%s\n仓库应有 %d 个文件 / zip 内 %d 个\n缺少：%s\n参数文档一致：%s\n"
              % (verdict, len(expect), len(names), miss[:20] or "无", same))
          print("结论：%s（仓库应有 %d / zip 内 %d）" % (verdict, len(expect), len(names)))
          for p in problems:
              print("  !! %s" % p)
          raise SystemExit(0 if verdict == "PASS" else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test_${{ matrix.key }}
          path: out/${{ matrix.key }}
          retention-days: 30

  # ── 汇总：把各平台结论合成一张表 ──────────────────────────────
  # ══════════════════════════════════════════════════════════════
  # 工具链自测：不需要下载任何包，几秒跑完，专测"验收/打包逻辑本身"
  # （ELF 32/64 位解析、链式补库、Windows 找 exe、Android 四种形态、
  #   参数文档是否与代码一致）
  # ══════════════════════════════════════════════════════════════
  selftest:
    name: selftest（工具链单测）
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装最小依赖（config 需要 numpy）
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet numpy
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: 跑工具链自测
        run: python tools/selftest_verify.py

      - name: 参数文档与代码一致性
        run: python tools/gen_cli_doc.py --check

  summary:
    name: verify-summary
    needs: [verify, selftest]
    if: always()
    runs-on: ubuntu-latest
    env:
      SELFTEST_RESULT: ${{ needs.selftest.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: test_*

      - name: 汇总
        run: |
          python - <<'PY'
          import json, os, glob, re
          rows, fails, missing = [], [], []
          for p in sorted(glob.glob("all/*/meta.json")):
              d = json.load(open(p, encoding="utf-8"))
              key = os.path.basename(os.path.dirname(p))
              ok = d.get("verdict") == "PASS"
              rows.append("| %s | %s | %s | %s |" % (
                  d.get("platform"), d.get("arch"), key.replace("test_", ""),
                  "✅" if ok else "❌ " + "; ".join(d.get("problems") or [])))
              if not ok:
                  fails.append(key)
          # 只有 summary.txt（Release 里还没有这个包）→ MISSING 行
          for p in sorted(glob.glob("all/*/summary.txt")):
              key = os.path.basename(os.path.dirname(p))
              if os.path.exists(os.path.join(os.path.dirname(p), "meta.json")):
                  continue
              txt = open(p, encoding="utf-8", errors="replace").read()
              m = re.search(r"平台/架构：(\S+)", txt)
              v = re.search(r"结论：(\S+)", txt)
              rows.append("| %s | %s | %s | %s |" % (
                  (m.group(1).split("/")[0] if m else "?"),
                  (m.group(1).split("/")[1] if m else "?"),
                  key.replace("test_", ""),
                  "⚠️ " + (v.group(1) if v else "MISSING") + "（Release 里暂无此包）"))
              missing.append(key)
          body = ["# Release 验收结果", "",
                  "- 工具链自测（selftest）：%s" % (
                      "✅ 通过（ELF 解析 / 链式补库 / Windows 找 exe / "
                      "Android 四形态 / 参数文档一致性）"
                      if os.environ.get("SELFTEST_RESULT") == "success"
                      else "❌ %s" % os.environ.get("SELFTEST_RESULT")),
                  "",
                  "| 平台 | 架构 | artifact | 结论 |", "|---|---|---|---|"] + rows
          txt = "\n".join(body) + "\n"
          open("verify-summary.md", "w", encoding="utf-8").write(txt)
          print(txt)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(txt)
          print("FAIL 数：%d  MISSING 数：%d" % (len(fails), len(missing)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test_summary
          path: verify-summary.md
          retention-days: 30