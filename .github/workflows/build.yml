name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  OWNRENDER_HOME: ${{ github.workspace }}
  # Windows 控制台默认 cp1252/cp936，强制 Python 走 UTF-8，避免中文输出炸掉
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ══════════════════════════════════════════════════════════════
  # ① Linux 原生架构：x86_64 / aarch64
  # ══════════════════════════════════════════════════════════════
  linux-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow requests nuitka

      - name: 源码自检（打包前）
        shell: bash
        run: |
          python -m compileall -q .
          python main.py --list-backgrounds --no-color | head -5
          python main.py --version

      - name: Nuitka 打包
        shell: bash
        run: python tools/build_nuitka.py --no-onefile --out dist --archive --name "${{ matrix.name }}"

      - name: 冒烟测试（二进制必须能独立跑）
        shell: bash
        run: |
          set -e
          DIR=$(ls -d dist/OwnRender-* | head -1)
          BIN="$DIR/ownrender"
          echo "== 二进制: $BIN"
          "$BIN" --version
          "$BIN" --list-backgrounds --no-color | head -3
          "$BIN" --offline-bg 微水泥 --time "2025-06-21T09:00:00+08:00" \
                 --lat 39.9042 --lon 116.4074 --weather clear \
                 --ssaa 2 --text "构建自检" -y --no-color
          ls -la output/ | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ② Linux 32 位：x86(i386) / armv7(armhf)
  #    x86 走原生 386 容器；armv7 走 qemu 模拟（慢，失败不阻塞发布）
  # ══════════════════════════════════════════════════════════════
  linux-32bit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.soft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86,    image: debian:bookworm,          platform: 'linux/386',    timeout: 150, soft: false }
          - { name: linux-armv7,  image: arm32v7/debian:bookworm,  platform: 'linux/arm/v7', timeout: 330, soft: true }
    steps:
      - uses: actions/checkout@v4

      - name: 准备 qemu（仅 armv7 需要）
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      - name: 构建 + 冒烟测试（容器内完成，产物落在宿主 dist/）
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                python3 python3-venv python3-numpy python3-pil python3-requests \
                python3-dev gcc binutils patchelf
              python3 -m venv --system-site-packages /venv
              /venv/bin/pip install -q --upgrade pip
              /venv/bin/pip install -q nuitka
              echo "== 容器内 Python:"; /venv/bin/python -V; uname -m
              /venv/bin/python -m compileall -q .
              /venv/bin/python tools/build_nuitka.py --no-onefile --out dist --archive \
                --name "${{ matrix.name }}"
              DIR=$(ls -d dist/OwnRender-* | head -1)
              echo "== 冒烟测试: $DIR"
              "$DIR/ownrender" --version
              "$DIR/ownrender" --list-backgrounds --no-color | head -3
              "$DIR/ownrender" --offline-bg 微水泥 --ssaa 1 --text "构建自检" -y --no-color
              ls -la output/ | tail -3
            '
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ③ Windows：x86_64 / x86(32位) / arm64
  #    32 位用 32 位 Python 解释器跑 Nuitka，产出的就是 32 位 exe
  # ══════════════════════════════════════════════════════════════
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.soft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  name: windows-x86_64, arch: x64,   soft: false }
          - { os: windows-latest,  name: windows-x86,    arch: x86,   soft: false }
          - { os: windows-11-arm,  name: windows-arm64,  arch: arm64, soft: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 优先最新版；32 位/arm64 上若没有对应 wheel，回退到仍有该架构 wheel 的版本
          pip install numpy Pillow requests nuitka \
            || pip install "numpy<2" "Pillow<11" requests nuitka

      - name: 确认解释器位数
        shell: bash
        run: python -c "import platform,struct;print(platform.machine(), struct.calcsize('P')*8, 'bit')"

      - name: 源码自检（打包前）
        shell: bash
        run: |
          python -m compileall -q .
          python main.py --list-backgrounds --no-color | head -5
          python main.py --version

      - name: Nuitka 打包
        shell: bash
        run: python tools/build_nuitka.py --no-onefile --out dist --archive --name "${{ matrix.name }}"

      - name: 冒烟测试（二进制必须能独立跑）
        shell: bash
        run: |
          set -e
          DIR=$(ls -d dist/OwnRender-* | head -1)
          BIN="$DIR/ownrender.exe"
          echo "== 二进制: $BIN"
          "$BIN" --version
          "$BIN" --list-backgrounds --no-color | head -3
          "$BIN" --offline-bg 微水泥 --time "2025-06-21T09:00:00+08:00" \
                 --lat 39.9042 --lon 116.4074 --weather clear \
                 --ssaa 2 --text "构建自检" -y --no-color
          ls -la output/ | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ④ Android：x86(NULL) 不需要；产 arm64-v8a / armeabi-v7a 两套 .so
  #    用 python-for-android 构建，从 APK 中提取 lib/*/*.so
  # ══════════════════════════════════════════════════════════════
  android:
    name: android-so (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # p4a 对 3.11 兼容最好

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 platforms;android-34 build-tools;33.0.2 build-tools;34.0.0 ndk;25.2.9519653'

      - name: 安装 python-for-android
        run: |
          python -m pip install --upgrade pip
          # 钉版本：最新版 p4a 默认 Python 3.14，其 numpy/android recipe 尚不可用
          # 2023.9.16 = Python 3.10.10 + numpy 1.22.3，recipe 组合自洽
          pip install "cython<3.0" "python-for-android==2023.9.16"

      - name: 构建 dist（p4a create，编 Python/numpy 等 recipe）
        env:
          ANDROIDNDKVER: 25.2.9519653
        run: |
          p4a create \
            --dist-name ownrender-${{ matrix.abi }} \
            --bootstrap service_only \
            --requirements python3,numpy,pillow,requests \
            --arch ${{ matrix.abi }} \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653"

      - name: 修 p4a 2023.9.16 的 dist 模板 bug
        run: |
          # 该版本生成的 dists/*/build.py 引用了 apk 阶段并未定义的 --orientation，
          # 打包时会 AttributeError: 'Namespace' object has no attribute 'orientation'
          F="$HOME/.local/share/python-for-android/dists/ownrender-${{ matrix.abi }}/build.py"
          ls -la "$F"
          python - "$F" <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding="utf-8").read()
          new = s.replace("args.orientation",
                          "getattr(args, 'orientation', 'portrait')")
          new = new.replace("args.manifest_orientation",
                            "getattr(args, 'manifest_orientation', None)")
          io.open(p, "w", encoding="utf-8").write(new)
          print("orientation 补丁:", new != s)
          PY

      - name: 打包 APK（复用已有 dist，只为提取 .so）
        env:
          ANDROIDNDKVER: 25.2.9519653
        run: |
          # 版本号从 config.py 取，避免和引擎版本漂移
          APPVER=$(python -c 'import re;print(re.search(r"VERSION\s*=\s*\"([^\"]+)\"",open("config.py",encoding="utf-8").read()).group(1))')
          echo "APPVER=$APPVER"
          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package org.ownrender.engine \
            --name OwnRender \
            --version "$APPVER" \
            --bootstrap service_only \
            --requirements python3,numpy,pillow,requests \
            --arch ${{ matrix.abi }} \
            --dist-name ownrender-${{ matrix.abi }} \
            --android-api 33 \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653"

      - name: 提取 .so
        run: |
          mkdir -p android-so/${{ matrix.abi }}
          APK=$(find dist -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "找不到 APK，dist 内容："; ls -laR dist | head -40; exit 1; fi
          echo "APK = $APK"
          unzip -o "$APK" 'lib/*' -d _apk
          cp -v _apk/lib/${{ matrix.abi }}/*.so android-so/${{ matrix.abi }}/
          ls -la android-so/${{ matrix.abi }}/ | head -20
          printf '%s\n' \
            "Android .so 使用方式（参数模式）" \
            "=================================" \
            "ABI: ${{ matrix.abi }}" \
            "本目录是从 python-for-android 构建产物中提取的共享库，包含：" \
            "  libpython3.*.so   CPython 运行时" \
            "  lib*.so           本项目依赖的原生库（numpy/Pillow/OpenSSL 等）" \
            "必须在同一 Python-for-Android 运行时里加载，详见" \
            "docs/二进制包.md → Android(.so)" \
            > android-so/README.txt
          # 打成 zip：Release 汇总按 *.zip 收集产物，目录形式收不进去
          (cd android-so && zip -r ../OwnRender-android-${{ matrix.abi }}-so.zip .)
          ls -la OwnRender-android-${{ matrix.abi }}-so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OwnRender-android-${{ matrix.abi }}-so
          path: OwnRender-android-${{ matrix.abi }}-so.zip
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ⑤ 文档包（随 Release 一起发）
  # ══════════════════════════════════════════════════════════════
  docs:
    name: docs-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包文档
        run: |
          zip -r OwnRender-docs.zip \
            README.md README.en.md LICENSE CREDITS.md docs tools
          ls -la OwnRender-docs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: OwnRender-docs.zip
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ⑥ 发布：每次修改自动打包到 Release（main → nightly，tag → 版本）
  #    某个平台抖动不该卡住整条发布：有谁成功就发谁
  # ══════════════════════════════════════════════════════════════
  release:
    name: release
    needs: [docs]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装发布文件
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
               -exec cp -v {} out/ \;
          ls -la out/
          # 一个平台包都没有就别发空 Release（只发过 docs 不算）
          n=$(ls out 2>/dev/null | grep -cE '^OwnRender-(linux|windows|android)' || true)
          echo "平台包数量：$n"
          if [ "$n" -eq 0 ]; then echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"; fi

      - name: 生成 Release 说明（含文档）
        run: |
          {
            echo "# OwnRender 构建产物"
            echo
            echo "构建：\`${{ github.sha }}\` · 分支 \`${{ github.ref_name }}\`"
            echo "时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 下载"
            echo "| 文件 | 平台/架构 |"
            echo "|---|---|"
            for f in out/OwnRender-*.tar.gz out/OwnRender-*.zip; do
              [ -e "$f" ] || continue
              case "$f" in *docs*) continue ;; esac
              echo "| \`$(basename "$f")\` | $(basename "$f" | sed -E 's/^OwnRender-([^-]*-[A-Za-z0-9_]+).*/\1/') |"
            done
            echo
            echo "## 使用方式"
            echo
            sed -n '1,200p' docs/二进制包.md 2>/dev/null || echo "（见仓库 docs/）"
            echo
            echo "---"
            echo "许可：GNU AGPL-3.0 · 完整文档见 \`OwnRender-docs.zip\`"
          } > body.md
          wc -l body.md

      - name: 发布到 Releases
        if: env.SKIP_RELEASE != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly（自动构建）' }}
          body_path: body.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: out/*
          fail_on_unmatched_files: false
