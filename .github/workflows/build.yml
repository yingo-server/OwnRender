name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  OWNRENDER_HOME: ${{ github.workspace }}
  # Windows 控制台默认 cp1252/cp936，强制 Python 走 UTF-8，避免中文输出炸掉
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ══════════════════════════════════════════════════════════════
  # ① 桌面三平台：Windows / Linux / macOS（Nuitka 打包）
  # ══════════════════════════════════════════════════════════════
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: windows-latest,  name: windows-x86_64 }
          - { os: macos-13,        name: macos-x86_64 }
          - { os: macos-14,        name: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow requests nuitka

      - name: 源码自检（打包前）
        shell: bash
        run: |
          python -m compileall -q .
          python main.py --list-backgrounds --no-color | head -5
          python main.py --version

      - name: Nuitka 打包
        shell: bash
        run: python tools/build_nuitka.py --onefile --out dist --archive

      - name: 冒烟测试（二进制必须能独立跑）
        shell: bash
        run: |
          set -e
          DIR=$(ls -d dist/OwnRender-* | head -1)
          BIN="$DIR/ownrender"
          [ -f "$DIR/ownrender.exe" ] && BIN="$DIR/ownrender.exe"
          echo "== 二进制: $BIN"
          "$BIN" --version
          "$BIN" --list-backgrounds --no-color | head -3
          # 全链路：真渲染一张（验证 numpy/Pillow/字体/素材都在包里可用）
          "$BIN" --offline-bg 微水泥 --time "2025-06-21T09:00:00+08:00" \
                 --lat 39.9042 --lon 116.4074 --weather clear \
                 --ssaa 2 --text "构建自检" -y --no-color
          ls -la output/ | tail -3

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ② Android：产出台 .so（宿主 App 以 JNI / 参数模式调用）
  #    用 python-for-android 构建，从 APK 中提取 lib/*/*.so
  # ══════════════════════════════════════════════════════════════
  android:
    name: android-so (arm64-v8a)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # p4a 对 3.11 兼容最好

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: 安装 python-for-android
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" buildozer python-for-android

      - name: 构建（service_only bootstrap → 参数模式）
        env:
          ANDROIDNDKVER: 25.2.9519653
        run: |
          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package org.ownrender.engine \
            --name OwnRender \
            --version 10.0.0 \
            --bootstrap service_only \
            --requirements python3,numpy,pillow,requests \
            --arch arm64-v8a \
            --dist-name ownrender \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653" \
            --release || echo "P4A_BUILD_FAILED=1" >> "$GITHUB_ENV"

      - name: 提取 .so
        if: env.P4A_BUILD_FAILED != '1'
        run: |
          mkdir -p android-so/arm64-v8a
          APK=$(ls dist/ownrender/*.apk | head -1)
          echo "APK = $APK"
          unzip -o "$APK" 'lib/*' -d _apk || true
          cp -v _apk/lib/arm64-v8a/*.so android-so/arm64-v8a/ || true
          ls -la android-so/arm64-v8a/ | head -20
          printf '%s\n' \
            "Android .so 使用方式（参数模式）" \
            "=================================" \
            "本目录是从 python-for-android 构建产物中提取的共享库，包含：" \
            "  libpython3.*.so   CPython 运行时" \
            "  libpybundle.so    本项目的 Python 模块（已冻结）" \
            "必须在同一 Python-for-Android 运行时里加载，详见" \
            "docs/二进制包.md → Android(.so)" \
            > android-so/README.txt

      - name: 上传 .so
        if: env.P4A_BUILD_FAILED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: android-so/**
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ③ 文档包（随 Release 一起发）
  # ══════════════════════════════════════════════════════════════
  docs:
    name: docs-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包文档
        run: |
          zip -r OwnRender-docs.zip \
            README.md README.en.md LICENSE CREDITS.md docs tools
          ls -la OwnRender-docs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: OwnRender-docs.zip
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ④ 发布：每次修改自动打包到 Release（main → nightly，tag → 版本）
  # ══════════════════════════════════════════════════════════════
  release:
    name: release
    needs: [desktop, docs]
    if: always() && github.event_name != 'pull_request' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装发布文件
        run: |
          mkdir -p out
          cp -v OwnRender-docs.zip out/ 2>/dev/null || true
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
               -exec cp -v {} out/ \;
          ls -la out/

      - name: 生成 Release 说明（含文档）
        run: |
          {
            echo "# OwnRender 构建产物"
            echo
            echo "构建：\`${{ github.sha }}\` · 分支 \`${{ github.ref_name }}\`"
            echo "时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 下载"
            echo "| 文件 | 平台 |"
            echo "|---|---|"
            for f in out/OwnRender-*.tar.gz out/OwnRender-*.zip; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(basename "$f" | sed -E 's/OwnRender-([a-z0-9_]+-[a-z0-9_]+).*/\1/') |"
            done
            echo
            echo "## 使用方式"
            echo
            sed -n '1,200p' docs/二进制包.md 2>/dev/null || echo "（见仓库 docs/）"
            echo
            echo "---"
            echo "许可：GNU AGPL-3.0 · 完整文档见 \`OwnRender-docs.zip\`"
          } > body.md
          wc -l body.md

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly（自动构建）' }}
          body_path: body.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: out/*
          fail_on_unmatched_files: false