name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 自动重建一次：保证 nightly 不过期，也顺手做一次"每周体检"
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  OWNRENDER_HOME: ${{ github.workspace }}
  # Windows 控制台默认 cp1252/cp936，强制 Python 走 UTF-8，避免中文输出炸掉
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ══════════════════════════════════════════════════════════════
  # ① Linux 原生架构：x86_64 / aarch64
  # ══════════════════════════════════════════════════════════════
  linux-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow requests nuitka

      - name: 源码自检（打包前）
        shell: bash
        run: |
          python -m compileall -q .
          python main.py --list-backgrounds --no-color | head -5
          python main.py --version

      - name: Nuitka 打包
        shell: bash
        run: python tools/build_nuitka.py --no-onefile --out dist --archive --name "OwnRender-${{ matrix.name }}"

      - name: 冒烟测试（二进制必须能独立跑）
        shell: bash
        run: |
          set -e
          DIR=$(ls -d dist/OwnRender-* 2>/dev/null | head -1)
          if [ -z "$DIR" ]; then
            DIR=$(find dist -mindepth 1 -maxdepth 1 -type d ! -name '*.build' ! -name '*.dist' | head -1)
          fi
          if [ -z "$DIR" ]; then echo "找不到产物目录"; ls -la dist; exit 1; fi
          BIN="$DIR/ownrender"
          [ -f "$DIR/ownrender.exe" ] && BIN="$DIR/ownrender.exe"
          echo "== 二进制: $BIN"
          "$BIN" --version
          "$BIN" --list-backgrounds --no-color | head -3
          "$BIN" --offline-bg 微水泥 --time "2025-06-21T09:00:00+08:00" \
                 --lat 39.9042 --lon 116.4074 --weather clear \
                 --ssaa 2 --text "构建自检" -y --no-color
          ls -la output/ | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ②【已弃用】Linux 32 位（x86/i386 与 armv7/armhf）
  #
  #    弃用原因（详见 docs/二进制包.md「已弃用平台」）：
  #    - x86(i386)：Debian 的 python3-numpy / python3-pil 链接的是系统库
  #      （libblas/liblapack/libgfortran/libjpeg/libtiff/libwebp/... 共 30 个），
  #      Nuitka standalone 不会带，实测需要额外补 22 MB 才能跑；
  #      而 32 位 Linux 桌面/服务器如今基本绝迹，维护成本远大于收益。
  #    - armv7(armhf)：GitHub 没有 arm32 runner，只能 qemu 全指令模拟编译，
  #      单独一个 job 就要 40~80 分钟，且结果不稳定。
  #
  #    需要这两个架构的用户请自行构建（源码与打包脚本都在仓库里）：
  #      python3 tools/build_nuitka.py --no-onefile --out dist --archive
  # ══════════════════════════════════════════════════════════════

  # ══════════════════════════════════════════════════════════════
  # ③ Windows：x86_64 / x86(32位) / arm64
  #    32 位用 32 位 Python 解释器跑 Nuitka，产出的就是 32 位 exe
  # ══════════════════════════════════════════════════════════════
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.soft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64, arch: x64,   soft: false }
          - { os: windows-latest, name: windows-x86,    arch: x86,   soft: false }
          - { os: windows-11-arm, name: windows-arm64,  arch: arm64, soft: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 优先最新版；32 位/arm64 上若没有对应 wheel，回退到仍有该架构 wheel 的版本
          pip install numpy Pillow requests nuitka \
            || pip install "numpy<2" "Pillow<11" requests nuitka

      - name: 确认解释器位数
        shell: bash
        run: python -c "import platform,struct;print(platform.machine(), struct.calcsize('P')*8, 'bit')"

      - name: 源码自检（打包前）
        shell: bash
        run: |
          python -m compileall -q .
          python main.py --list-backgrounds --no-color | head -5
          python main.py --version

      - name: Nuitka 打包
        shell: bash
        run: python tools/build_nuitka.py --no-onefile --out dist --archive --name "OwnRender-${{ matrix.name }}"

      - name: 冒烟测试（二进制必须能独立跑）
        shell: bash
        run: |
          set -e
          DIR=$(ls -d dist/OwnRender-* 2>/dev/null | head -1)
          if [ -z "$DIR" ]; then
            DIR=$(find dist -mindepth 1 -maxdepth 1 -type d ! -name '*.build' ! -name '*.dist' | head -1)
          fi
          if [ -z "$DIR" ]; then echo "找不到产物目录"; ls -la dist; exit 1; fi
          BIN="$DIR/ownrender.exe"
          echo "== 二进制: $BIN"
          "$BIN" --version
          "$BIN" --list-backgrounds --no-color | head -3
          "$BIN" --offline-bg 微水泥 --time "2025-06-21T09:00:00+08:00" \
                 --lat 39.9042 --lon 116.4074 --weather clear \
                 --ssaa 2 --text "构建自检" -y --no-color
          ls -la output/ | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ④ Android：产 arm64-v8a / armeabi-v7a 两套 .so
  #    用 python-for-android 构建，从 APK 中提取 lib/*/*.so
  # ══════════════════════════════════════════════════════════════
  android:
    name: android-so (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # 以前这里是 continue-on-error: true，Android 的"包不完整"就这样被静默吞了。
    # 现在 Android 已能通过验收，改成正常门禁：失败就是红。
    # release 仍用 if: always() 照常发布其它平台（谁成功发谁），不会互相拖累。
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # p4a 对 3.11 兼容最好

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 platforms;android-34 build-tools;33.0.2 build-tools;34.0.0 ndk;25.2.9519653'

      - name: 安装 python-for-android
        run: |
          python -m pip install --upgrade pip
          # 钉版本：最新版 p4a 默认 Python 3.14，其 numpy/android recipe 尚不可用
          # 2023.9.16 = Python 3.10.10 + numpy 1.22.3，recipe 组合自洽
          pip install "cython<3.0" "python-for-android==2023.9.16"

      - name: 构建 dist（p4a create，编 Python/numpy 等 recipe）
        env:
          ANDROIDNDKVER: 25.2.9519653
        run: |
          p4a create \
            --dist-name ownrender-${{ matrix.abi }} \
            --bootstrap service_only \
            --requirements python3,numpy,pillow,requests \
            --arch ${{ matrix.abi }} \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653"

      - name: 修 p4a 2023.9.16 的 dist 模板 bug
        run: |
          # 该版本生成的 dists/*/build.py 引用了 apk 阶段并未定义的 --orientation，
          # 打包时会 AttributeError: 'Namespace' object has no attribute 'orientation'。
          # 注意：只能替换「读取」，绝不能碰赋值语句左边（否则
          #   getattr(args, 'x', None) = ...  → SyntaxError: cannot assign to function call）
          F="$HOME/.local/share/python-for-android/dists/ownrender-${{ matrix.abi }}/build.py"
          ls -la "$F"
          python - "$F" <<'PY'
          import io, re, sys
          p = sys.argv[1]
          s = io.open(p, encoding="utf-8").read()
          n = re.sub(r"args\.orientation(?!\s*[+\-*/%|&^]?=(?!=))",
                     "getattr(args, 'orientation', 'portrait')", s)
          n = re.sub(r"args\.manifest_orientation(?!\s*[+\-*/%|&^]?=(?!=))",
                     "getattr(args, 'manifest_orientation', None)", n)
          io.open(p, "w", encoding="utf-8").write(n)
          print("orientation 补丁生效:", n != s)
          PY
          python -c "import ast,io,sys;ast.parse(io.open(sys.argv[1],encoding='utf-8').read());print('build.py 语法校验通过')" "$F"

      - name: 打包 APK（复用已有 dist，只为提取 .so）
        env:
          ANDROIDNDKVER: 25.2.9519653
        run: |
          # 版本号从 config.py 取，避免和引擎版本漂移
          APPVER=$(python -c 'import re;print(re.search(r"VERSION\s*=\s*\"([^\"]+)\"",open("config.py",encoding="utf-8").read()).group(1))')
          echo "APPVER=$APPVER"
          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package org.ownrender.engine \
            --name OwnRender \
            --version "$APPVER" \
            --bootstrap service_only \
            --requirements python3,numpy,pillow,requests \
            --arch ${{ matrix.abi }} \
            --dist-name ownrender-${{ matrix.abi }} \
            --android-api 33 \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653"

      - name: 提取 .so
        run: |
          mkdir -p android-so/${{ matrix.abi }}
          # p4a 2023.9.16 把 APK 放在 dists/<dist>/build/outputs/apk/debug/ 下，
          # 不再落 dist/。两个位置都找，避免"构建成功却找不到包"。
          P4A_DISTS="$HOME/.local/share/python-for-android/dists"
          APK=$(find . "$P4A_DISTS" -name '*.apk' 2>/dev/null \
                | grep -v '/_apk/' | head -1)
          if [ -z "$APK" ]; then
            echo "找不到 APK，候选如下："
            find . "$P4A_DISTS" -name '*.apk' 2>/dev/null | head -20
            ls -laR dist 2>/dev/null | head -20
            exit 1
          fi
          echo "APK = $APK"
          unzip -o "$APK" 'lib/*' -d _apk
          cp -v _apk/lib/${{ matrix.abi }}/*.so android-so/${{ matrix.abi }}/
          ls -la android-so/${{ matrix.abi }}/ | head -20

          # ── 诊断：numpy / Pillow 的模块到底躺在 APK 的哪一层 ──────────
          echo "== APK 顶层目录统计 =="
          unzip -l "$APK" | awk 'NF>=4 {print $4}' | grep -E '/' \
            | cut -d/ -f1 | sort | uniq -c | sort -rn | head -10
          echo "== numpy / Pillow 相关条目数 =="
          echo "numpy      : $(unzip -l "$APK" | grep -icE 'numpy' || true)"
          echo "_multiarray: $(unzip -l "$APK" | grep -icE '_multiarray' || true)"
          echo "_imaging   : $(unzip -l "$APK" | grep -icE '_imaging' || true)"
          unzip -l "$APK" | grep -iE 'numpy|_imaging' | head -8 || true

          # ── 完整运行时：把 APK 原件一起交付 ────────────────────────
          # APK 提供 native 库 + 本项目代码；但实测它**不含** numpy/Pillow
          # 的模块（下面会把它们从 dist 的 site-packages 捞出来一并打包）。
          cp -v "$APK" OwnRender-android-${{ matrix.abi }}.apk
          ls -la OwnRender-android-${{ matrix.abi }}.apk

          # ── 把 p4a dist 里的 site-packages / libs 一起交付 ────────────
          # 事实：APK 的 lib/<abi>/*.so 只有 9 个，libpybundle.so 里是 569 个
          # stdlib .pyc，assets/private.tar 只是本项目代码 —— 也就是说 p4a
          # 虽然日志显示 "Installing numpy/Pillow into site-packages"，
          # 但这些模块并没有出现在 APK 里。这里把 dist 里的相应目录一并打包，
          # 并打印诊断，免得"构建成功≠能跑"再发生一次。
          DIST="$P4A_DISTS/ownrender-${{ matrix.abi }}"
          echo "== p4a dist：$DIST"
          ls -la "$DIST" 2>/dev/null || true
          echo "== dist 内 numpy / Pillow 相关（最多 20 条）"
          find "$DIST" -maxdepth 5 \( -name '*numpy*' -o -name '*_imaging*' \) 2>/dev/null | head -20 || true
          echo "== dist/libs/${{ matrix.abi }} 的 .so 数"
          ls "$DIST/libs/${{ matrix.abi }}" 2>/dev/null | wc -l || true
          ls "$DIST/libs/${{ matrix.abi }}" 2>/dev/null | head -12 || true
          mkdir -p "android-so/${{ matrix.abi }}/p4a-dist"
          for SRC in "$DIST/_python_bundle" "$DIST/site-packages" "$DIST/libs/${{ matrix.abi }}"; do
            if [ -d "$SRC" ]; then
              echo "打包 $SRC"
              cp -r "$SRC" "android-so/${{ matrix.abi }}/p4a-dist/" || true
            fi
          done
          du -sh "android-so/${{ matrix.abi }}/p4a-dist" 2>/dev/null || true
          # 兜底：不论 p4a 把它们放在哪一层，按目录名把 numpy / PIL 连同
          # 依赖（*.so）原样捞进包里 —— 这就是"手动补"的正解：
          # 模块早就编好了，只是没被 APK 打包，我们从 dist 里直接取。
          find "$DIST" -maxdepth 6 -type d \( -name numpy -o -name PIL \) 2>/dev/null \
            | while read -r d; do
                REL="${d#$DIST/}"
                mkdir -p "android-so/${{ matrix.abi }}/p4a-dist/$(dirname "$REL")"
                cp -r "$d" "android-so/${{ matrix.abi }}/p4a-dist/$(dirname "$REL")/" || true
                echo "捞入 $REL"
              done
          # 再兜一次：dist 里任何 *multiarray* / *_imaging* / *.so 的模块文件
          find "$DIST" -maxdepth 7 -type f \( -name '*_multiarray*' -o -name '*_imaging*' \) 2>/dev/null \
            | head -50 | while read -r f; do
                REL="${f#$DIST/}"
                mkdir -p "android-so/${{ matrix.abi }}/p4a-dist/$(dirname "$REL")"
                cp "$f" "android-so/${{ matrix.abi }}/p4a-dist/$(dirname "$REL")/" || true
              done
          du -sh "android-so/${{ matrix.abi }}/p4a-dist" 2>/dev/null || true
          echo "== 捞完之后包内的 numpy / PIL 命中 =="
          find "android-so/${{ matrix.abi }}/p4a-dist" \( -name '*numpy*' -o -name '*_imaging*' \) 2>/dev/null \
            | head -10 || true
          echo "命中数：$(find "android-so/${{ matrix.abi }}/p4a-dist" \( -name '*numpy*' -o -name '*_imaging*' \) 2>/dev/null | wc -l)"
          printf '%s\n' \
            "Android 交付物（参数模式）" \
            "=========================" \
            "ABI: ${{ matrix.abi }}" \
            "1) OwnRender-android-${{ matrix.abi }}-so.zip   ← 完整运行时（推荐）" \
            "   lib/${{ matrix.abi }}/*.so      CPython / libmain / OpenSSL / SQLite / FreeType / PNG" \
            "   p4a-dist/                       p4a dist 的 site-packages：" \
            "                                   numpy（含 _multiarray_umath*.so）、Pillow（含 _imaging*.so）" \
            "2) OwnRender-android-${{ matrix.abi }}.apk" \
            "   p4a 直接产出的 APK：native 库 + 本项目代码（assets/private.tar）。" \
            "   实测该版本 p4a 打包 APK 时没有把 site-packages 收进去，所以 APK" \
            "   需要配合上面的 p4a-dist/ 一起用；两者都在本 zip 与 Release 里。" \
            "详见 docs/二进制包.md → Android。" \
            > android-so/README.txt
          # 打成 zip：Release 汇总按 *.zip 收集产物，目录形式收不进去
          (cd android-so && zip -r ../OwnRender-android-${{ matrix.abi }}-so.zip .)
          ls -la OwnRender-android-${{ matrix.abi }}-so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OwnRender-android-${{ matrix.abi }}
          path: |
            OwnRender-android-${{ matrix.abi }}-so.zip
            OwnRender-android-${{ matrix.abi }}.apk
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ⑤ 文档包（随 Release 一起发）
  # ══════════════════════════════════════════════════════════════
  docs:
    name: docs-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 生成 AI 参数文档（从 cli.py / config.py 内省，保证与代码一致）
        run: |
          python tools/gen_cli_doc.py
          python tools/gen_cli_doc.py --check        # 再校验一次，不一致就红
          ls -la docs/CLI-参数.ai.md docs/cli-args.json

      - name: 打包文档
        run: |
          zip -r OwnRender-docs.zip \
            README.md README.en.md LICENSE CREDITS.md docs tools
          ls -la OwnRender-docs.zip
          unzip -l OwnRender-docs.zip | grep -E 'CLI-参数.ai.md|cli-args.json|verify_package|selftest_verify' 
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: OwnRender-docs.zip
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ⑥ 发布：每次修改自动打包到 Release（main → nightly，tag → 版本）
  #    某个平台抖动不该卡住整条发布：有谁成功就发谁
  # ══════════════════════════════════════════════════════════════
  release:
    name: release
    # 等所有平台 job 结束（不论成败）再收集产物发布；谁成功收谁。
    # Release 固定用同一 nightly 标签滚动更新，重跑本 job 即可追加/覆盖资产。
    needs: [docs, linux-native, windows, android]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装发布文件
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) \
               -exec cp -v {} out/ \;
          ls -la out/
          # 一个平台包都没有就别发空 Release（只发过 docs 不算）
          # 兼容两种命名：OwnRender-xxx 与（历史遗留的）无前缀命名
          n=$(ls out 2>/dev/null | grep -cE '^(OwnRender-)?(linux|windows|android)' || true)
          echo "平台包数量：$n"
          if [ "$n" -eq 0 ]; then echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"; fi

      - name: 生成 Release 说明（含文档）
        run: |
          {
            echo "# OwnRender 构建产物"
            echo
            echo "构建：\`${{ github.sha }}\` · 分支 \`${{ github.ref_name }}\`"
            echo "时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 下载"
            echo "| 文件 | 平台/架构 |"
            echo "|---|---|"
            for f in out/*.tar.gz out/*.zip out/*.apk; do
              [ -e "$f" ] || continue
              case "$f" in *docs*) continue ;; esac
              echo "| \`$(basename "$f")\` | $(basename "$f" | sed -E 's/^OwnRender-([A-Za-z0-9_]+-[A-Za-z0-9_]+).*/\1/') |"
            done
            echo
            echo "## ⚠️ 已弃用平台（不再提供二进制，请自行构建）"
            echo
            echo "| 平台/架构 | 弃用原因 |"
            echo "|---|---|"
            echo "| \`linux-x86\`（32 位 x86 / i386） | 32 位 Linux 桌面与服务器已基本绝迹；且 Debian 的 \`python3-numpy\`/\`python3-pil\` 链接的是系统库（libblas / liblapack / libgfortran / libjpeg / libtiff / libwebp / libfreetype … 共 30 个），Nuitka standalone 不会自动带，实测要额外补 22 MB 才能跑，维护成本远大于收益 |"
            echo "| \`linux-armv7\`（32 位 ARM / armhf） | GitHub 没有 arm32 runner，只能靠 qemu 全指令模拟编译，单个任务要 40~80 分钟且结果不稳定（32 位树莓派等设备） |"
            echo
            echo "这两个架构的**源码与打包脚本都在仓库里**，可自行构建（需要 32 位 Python 环境）："
            echo
            echo '```bash'
            echo "python3 tools/build_nuitka.py --no-onefile --out dist --archive"
            echo "# 交叉/模拟（以 armv7 为例）"
            echo "docker run --rm --platform linux/arm/v7 -v \"\$PWD:/src\" -w /src \\"
            echo "  arm32v7/debian:bookworm bash -lc 'apt-get update -qq && \\"
            echo "    apt-get install -y -qq python3 python3-venv python3-numpy python3-pil \\"
            echo "      python3-dev gcc patchelf && \\"
            echo "    python3 -m venv /v && /v/bin/pip install nuitka && \\"
            echo "    /v/bin/python tools/build_nuitka.py --no-onefile --out dist --archive'"
            echo '```'
            echo
            echo "（打包脚本会自动读取 ELF 的 \`DT_NEEDED\`，把包内缺失的系统库补进包根，"
            echo "所以自建时通常不需要手工处理依赖。）"
            echo
            echo "## 使用方式"
            echo
            sed -n '1,200p' docs/二进制包.md 2>/dev/null || echo "（见仓库 docs/）"
            echo
            echo "---"
            echo "许可：GNU AGPL-3.0 · 完整文档见 \`OwnRender-docs.zip\`"
          } > body.md
          wc -l body.md

      - name: 发布到 Releases
        if: env.SKIP_RELEASE != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly（自动构建）' }}
          body_path: body.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: out/*
          fail_on_unmatched_files: false
          overwrite_files: true