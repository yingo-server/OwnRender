name: Build armv7 (standalone)

# 为什么单独一个 workflow：
#   GitHub 没有 arm32 runner，armv7(armhf) 只能靠 qemu 模拟编译，
#   单次 40 分钟以上。放在主构建里会把 release 一起拖住。
#   这里独立跑：构建完把包"追加/覆盖"进同一个 Release
#   （nightly 或对应 tag），不阻塞主流水线。
#
# 触发方式：
#   - 手动（Actions → 本 workflow → Run workflow）
#   - 每周一 05:00 UTC 自动跑一次
#   - 推送 v* 标签时（正式版要带 armv7）
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-armv7-${{ github.ref }}
  cancel-in-progress: true

env:
  OWNRENDER_HOME: ${{ github.workspace }}
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  armv7:
    name: linux-armv7
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 准备 qemu（armv7 需要）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: 构建 + 冒烟测试（qemu 容器内完成，产物落在宿主 dist/）
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            -e PYTHONUTF8=1 -e PYTHONIOENCODING=utf-8 \
            -v "$PWD:/src" -w /src \
            arm32v7/debian:bookworm bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                python3 python3-venv python3-numpy python3-pil python3-requests \
                python3-dev gcc binutils patchelf
              python3 -m venv --system-site-packages /venv
              /venv/bin/pip install -q --upgrade pip
              /venv/bin/pip install -q nuitka
              echo "== 容器内 Python:"; /venv/bin/python -V; uname -m
              /venv/bin/python -m compileall -q .
              /venv/bin/python tools/build_nuitka.py --no-onefile --out dist --archive \
                --name "OwnRender-linux-armv7"
              DIR=$(ls -d dist/OwnRender-linux-armv7 2>/dev/null | head -1)
              if [ -z "$DIR" ]; then echo "找不到产物目录"; ls -la dist; exit 1; fi
              echo "== 冒烟测试: $DIR"
              "$DIR/ownrender" --version
              "$DIR/ownrender" --list-backgrounds --no-color | head -3
              "$DIR/ownrender" --offline-bg 微水泥 --ssaa 1 --text "构建自检" -y --no-color
              ls -la output/ | tail -3
            '
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # 追加/覆盖到同一个 Release：不改正文，只补上 armv7 包
      - name: 追加到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly（自动构建）' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: false
          overwrite_files: true
